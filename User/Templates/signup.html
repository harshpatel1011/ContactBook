{% extends 'base.html' %}

{% block title %}ContactBook - Sign Up{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card">
            
            <div class="page-header">
                <div class="header-text">
                    <h1>Create Account</h1>
                    <p>Join ContactBook today</p>
                </div>
            </div>

            {% if messages %}
            <div class="message-container">
                {% for message in messages %}
                    <p class="message-text">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="username" name="username" required autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-input" type="password" id="password" name="password" required autocomplete="new-password">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password_confirm">Confirm Password</label>
                        <input class="form-input" type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password">
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Sign Up</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
            </div>
            
        </div>
    </div>
{% endblock %}
