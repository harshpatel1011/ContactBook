{% extends 'base.html' %}

{% block title %}ContactBook - Verify OTP{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card">
            <div class="page-header">
                <div class="header-text">
                    <h1>Verify OTP</h1>
                    <p>Enter the 6-digit code sent to your email</p>
                </div>
            </div>

            {% if messages %}
            <div class="message-container">
                {% for message in messages %}
                    <p class="message-text">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            

            <form method="POST" action="{% url 'verify_otp' %}" id="otp-form">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group text-center">
                        <label class="form-label otp-label">Enter OTP</label>
                        <div class="otp-inputs" id="otp-inputs">
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        </div>
                        <input type="hidden" id="otp" name="otp" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary mt-5">Verify</button>
                <div class="text-center mt-15">
                    <a href="{% url 'resend_otp' %}" class="link-primary">Resend OTP</a>
                </div>
            </form>

            <script>
                const inputs = document.querySelectorAll('.otp-input');
                const hiddenOtp = document.getElementById('otp');
                const form = document.getElementById('otp-form');

                inputs.forEach((input, index) => {
                    input.addEventListener('input', (e) => {
                        // Only allow numbers
                        e.target.value = e.target.value.replace(/[^0-9]/g, '');
                        if (e.target.value !== '' && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Backspace' && !e.target.value && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        }
                    });

                    // Handle paste
                    input.addEventListener('paste', (e) => {
                        e.preventDefault();
                        const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                        if (pastedData) {
                            pastedData.split('').forEach((char, i) => {
                                if (inputs[i]) {
                                    inputs[i].value = char;
                                    if (i < inputs.length - 1) {
                                        inputs[i + 1].focus();
                                    } else {
                                        inputs[i].focus();
                                    }
                                }
                            });
                        }
                    });
                });

                form.addEventListener('submit', (e) => {
                    let otpValue = '';
                    inputs.forEach(input => {
                        otpValue += input.value;
                    });
                    hiddenOtp.value = otpValue;
                });
            </script>
        </div>
    </div>
{% endblock %}
