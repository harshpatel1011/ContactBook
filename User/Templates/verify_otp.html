{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactBook - Verify OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="page-header">
                <div class="header-text">
                    <h1>Verify OTP</h1>
                    <p>Enter the 6-digit code sent to your email</p>
                </div>
            </div>

            {% if messages %}
            <div style="margin-bottom: 0.5rem; text-align: center;">
                {% for message in messages %}
                    <p style="color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem;">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <style>
                .otp-inputs {
                    display: flex;
                    justify-content: center;
                    gap: 12px;
                    margin-bottom: 20px;
                }
                .otp-input {
                    width: 48px;
                    height: 56px;
                    text-align: center;
                    font-size: 24px;
                    font-weight: 600;
                    border: 1px solid #E3DDD5;
                    border-radius: 8px;
                    background-color: #FAF8F5;
                    color: #332D28;
                }
                .otp-input:focus {
                    border-color: var(--primary);
                    outline: none;
                    box-shadow: 0 0 0 3px rgba(215, 105, 69, 0.15);
                }
            </style>

            <form method="POST" action="{% url 'verify_otp' %}" id="otp-form">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group" style="text-align: center;">
                        <label class="form-label" style="text-align: center; display: block; margin-bottom: 15px;">Enter OTP</label>
                        <div class="otp-inputs" id="otp-inputs">
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            <input class="otp-input" type="text" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        </div>
                        <input type="hidden" id="otp" name="otp" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 5px;">Verify</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="{% url 'resend_otp' %}" style="color: var(--primary); font-weight: 500; text-decoration: none;">Resend OTP</a>
                </div>
            </form>

            <script>
                const inputs = document.querySelectorAll('.otp-input');
                const hiddenOtp = document.getElementById('otp');
                const form = document.getElementById('otp-form');

                inputs.forEach((input, index) => {
                    input.addEventListener('input', (e) => {
                        // Only allow numbers
                        e.target.value = e.target.value.replace(/[^0-9]/g, '');
                        if (e.target.value !== '' && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Backspace' && !e.target.value && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        }
                    });

                    // Handle paste
                    input.addEventListener('paste', (e) => {
                        e.preventDefault();
                        const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
                        if (pastedData) {
                            pastedData.split('').forEach((char, i) => {
                                if (inputs[i]) {
                                    inputs[i].value = char;
                                    if (i < inputs.length - 1) {
                                        inputs[i + 1].focus();
                                    } else {
                                        inputs[i].focus();
                                    }
                                }
                            });
                        }
                    });
                });

                form.addEventListener('submit', (e) => {
                    let otpValue = '';
                    inputs.forEach(input => {
                        otpValue += input.value;
                    });
                    hiddenOtp.value = otpValue;
                });
            </script>
        </div>
    </div>
</body>
</html>
