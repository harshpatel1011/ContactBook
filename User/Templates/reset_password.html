{% extends 'base.html' %}

{% block title %}ContactBook - Reset Password{% endblock %}

{% block content %}
<div class="auth-container">
        <div class="auth-card">
            <div class="page-header">
                <div class="header-text">
                    <h1>Reset Password</h1>
                    <p>Enter your new password</p>
                </div>
            </div>

            {% if messages %}
            <div class="message-container">
                {% for message in messages %}
                    <p class="message-text">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'reset_password' %}">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="new_password">New Password</label>
                        <input class="form-input" type="password" id="new_password" name="new_password" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirm_password">Confirm New Password</label>
                        <input class="form-input" type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Reset Password</button>
            </form>
        </div>
    </div>
{% endblock %}
