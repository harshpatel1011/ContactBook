{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactBook - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="page-header">
                <div class="header-text">
                    <h1>Forgot Password</h1>
                    <p>Enter your email to receive an OTP</p>
                </div>
            </div>

            {% if messages %}
            <div style="margin-bottom: 0.5rem; text-align: center;">
                {% for message in messages %}
                    <p style="color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem;">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'forgot_password' %}">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="email" id="email" name="email" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Send OTP</button>
            </form>
            <div class="auth-footer">
                <p>Remember your password? <a href="{% url 'login' %}">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
