{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactBook - Edit Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            
            <div class="page-header">
                <div class="header-text">
                    <h1>Edit Contact</h1>
                    <p>Update contact information</p>
                </div>
            </div>

            {% if messages %}
            <div>
                {% for message in messages %}
                    <p class="form-label">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'edit_contact' contact.id %}">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input class="form-input" type="text" id="name" name="name" value="{{ contact.name }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="phone_number">Phone Number</label>
                        <input class="form-input" type="text" id="phone_number" name="phone_number" value="{{ contact.phone_number }}" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Update Contact</button>
            </form>
            
            <div class="auth-footer">
                <a href="{% url 'home' %}">Back to Dashboard</a>
            </div>
            
        </div>
    </div>
</body>
</html>
