{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactBook - Update Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            
            <div class="page-header">
                <div class="header-text">
                    <h1>Update Profile</h1>
                    <p>Edit your account details</p>
                </div>
            </div>

            {% if messages %}
            <div>
                {% for message in messages %}
                    <p class="form-label">{{ message }}</p>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'update_profile' %}">
                {% csrf_token %}
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-input" type="text" id="username" name="username" value="{{ user.username }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="email" id="email" name="email" value="{{ user.email }}" readonly disabled>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Confirm Password to Save</label>
                        <input class="form-input" type="password" id="password" name="password" placeholder="Enter current password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
            
            <div class="auth-footer">
                <a href="{% url 'home' %}">Back to Dashboard</a>
            </div>
            
        </div>
    </div>
</body>
</html>
